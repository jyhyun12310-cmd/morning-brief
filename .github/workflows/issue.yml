name: 오늘의 미장 이슈

on:
  schedule:
    # UTC 23:30 = KST 익일 08:30. 일~목(UTC) = 월~금(KST)
    # 조간 브리핑(07:00)과 1시간 30분 띄웁니다. 같은 계정에 연달아 올리면
    # 인스타가 스팸으로 보고 노출을 줄입니다.
    - cron: "30 23 * * 0-4"
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # docs/ 커밋 + GitHub Pages 반영

concurrency:
  group: morning-brief        # 조간 브리핑과 같은 그룹 — 동시에 push 하지 않게
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 한글 폰트 설치
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 이슈 카드 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: PYTHONPATH=src python src/issue_build.py

      - name: GitHub Pages 에 커밋
        # 조간 브리핑이 먼저 푸시해 둔 커밋이 있으므로 rebase 로 받아온 뒤 올립니다.
        run: |
          git config user.name  "morning-brief-bot"
          git config user.email "actions@github.com"
          git add docs
          git diff --staged --quiet || git commit -m "이슈 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: 카톡 · 인스타 발송
        env:
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          IG_USER_ID:          ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:     ${{ secrets.IG_ACCESS_TOKEN }}
        run: PYTHONPATH=src python src/publish.py

      - name: 갱신된 토큰 다시 저장
        # 액션은 상태가 없어서, 회전된 토큰을 시크릿에 되쓰지 않으면
        # 두 달 뒤 조용히 멈춥니다.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -f out/tokens/kakao_refresh_token.txt ] && \
            gh secret set KAKAO_REFRESH_TOKEN < out/tokens/kakao_refresh_token.txt
          [ -f out/tokens/ig_access_token.txt ] && \
            gh secret set IG_ACCESS_TOKEN < out/tokens/ig_access_token.txt
          exit 0

      - name: 실패 시 디버깅용 결과물 업로드
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: issue-debug
          path: |
            out/
            docs/cards/
          retention-days: 5
