name: Reviewed preview regression checks
on:
  push:
    branches: [main, 'chatgpt/editorial-design-*']
    paths:
      - 'automation/examples/visual-variety-preview.json'
      - 'automation/examples/design-*-preview.json'
      - 'src/reviewed_preview.py'
      - 'src/visual_assets.py'
      - 'src/card.html'
      - 'src/editorial_theme.css'
      - 'src/market_render.py'
      - 'src/breaking_card.html'
      - 'src/market_card.html'
      - 'src/market_style.css'
      - 'tests/test_reviewed_preview.py'
      - 'tests/test_stock_layout.py'
      - 'tests/fixtures/*-layout.json'
      - 'scripts/check_stock_layout.py'
      - '.github/workflows/*packet.yml'
      - '.github/workflows/reviewed-preview-test.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.32,<3' 'Pillow>=10,<13' 'Jinja2>=3.1,<4' 'playwright>=1.47,<2' 'pytest>=8,<10'
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: src

      - name: Install browser for non-publishing layout checks
        run: python -m playwright install --with-deps chromium
      - name: Render historical fixtures for layout review only
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from market_render import render_cards
          for kind in ('market', 'breaking'):
              packet = json.loads(Path(f'automation/examples/design-{kind}-preview.json').read_text())
              packet['intent'] = 'preview'
              # No publish/build call: historical content is only a layout fixture.
              render_cards({'market_brief': packet}, packet['summary'], f'qa/{kind}', kind)
          PY
      - name: Render seven-card historical stock layout without publishing
        env:
          PYTHONPATH: src
        run: python src/build.py --input automation/examples/visual-variety-preview.json --out qa-stock-out --docs qa/stock
      - name: Regress historical XOM seven-card layout without publishing
        env:
          PYTHONPATH: src
        run: python scripts/check_stock_layout.py tests/fixtures/xom-layout.json --out qa-xom-out --docs qa/xom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-review-only-do-not-publish
          path: |
            qa/
            qa-xom-out/*.failure.jpg
          retention-days: 7


